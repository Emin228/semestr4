<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Images</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 16px;
        }

        nav {
            margin-bottom: 24px;
        }

        nav a {
            margin-right: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 18px;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            background: #fafafa;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            background: white;
            border-radius: 8px;
        }

        .name {
            margin-top: 8px;
            text-align: center;
            word-break: break-word;
        }

        .empty {
            color: #666;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/makeimage">Создать изображение</a>
        <a href="/load_image">Загрузить изображение</a>
        <a href="/images">Все изображения</a>
        <a href="/login">Login</a>
    </nav>

    <h1>Все изображения</h1>

    {% if images %}
        <div class="grid">
            {% for image in images %}
                <div class="card">
                    <img src="{{ image.url }}" alt="{{ image.name }}">
                    <div class="name">{{ image.name }}</div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="empty">Пока нет сохранённых изображений.</p>
    {% endif %}
</body>
</html>
