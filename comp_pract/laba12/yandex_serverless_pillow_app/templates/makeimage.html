<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Make Image</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 760px;
            margin: 40px auto;
            padding: 0 16px;
        }

        label {
            display: block;
            margin-bottom: 14px;
        }

        input {
            padding: 8px;
            width: 260px;
        }

        button {
            padding: 9px 16px;
            cursor: pointer;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        nav {
            margin-bottom: 24px;
        }

        nav a {
            margin-right: 12px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/makeimage">Создать изображение</a>
        <a href="/load_image">Загрузить изображение</a>
        <a href="/images">Все изображения</a>
        <a href="/login">Login</a>
    </nav>

    <h1>Создание JPG-изображения</h1>

    {% if message %}
        <p class="error">message: "{{ message }}"</p>
    {% endif %}

    <form method="POST" action="/makeimage" enctype="application/x-www-form-urlencoded">
        <label>
            Width:
            <br>
            <input type="text" name="width" required>
        </label>

        <label>
            Height:
            <br>
            <input type="text" name="height" required>
        </label>

        <label>
            Text:
            <br>
            <input type="text" name="text" required>
        </label>

        <button type="submit">Generate image</button>
    </form>
</body>
</html>
